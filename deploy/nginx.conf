# /etc/nginx/sites-available/ats-algo  (symlink into sites-enabled)
#
# Reverse proxy in front of `next start`. Next's own docs recommend never
# exposing the Node server directly: nginx absorbs malformed requests, slow-loris
# connections and payload limits so the app spends its time rendering.
#
# Run `certbot --nginx -d yourdomain.com` AFTER installing this file — certbot
# rewrites the server block in place to add the 443 listener, the certificate
# paths, and the 80 -> 443 redirect.

upstream ats_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name yourdomain.com www.yourdomain.com;

  # Admin metric uploads post files; Next's default body limit is larger than
  # nginx's 1m, so nginx would be the one to 413.
  client_max_body_size 10m;

  # Slow-client protection: nginx holds the connection, not the Node process.
  client_body_timeout 15s;
  client_header_timeout 15s;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The scheduled routes are called over loopback by the systemd timers and have
  # no reason to be reachable from the internet. They already fail closed
  # without the bearer token — this just removes the surface.
  location /api/cron/ {
    deny all;
  }

  # Hashed build assets are immutable; serve them straight from the proxy cache
  # headers Next already sets and skip revalidation round-trips.
  location /_next/static/ {
    proxy_pass http://ats_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://ats_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_upgrade;

    # Exchange round-trips inside a request can outlast the 60s default.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;

    # Buffer responses so a slow client can't pin a Node worker.
    proxy_buffering on;
  }
}
